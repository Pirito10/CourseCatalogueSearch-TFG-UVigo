    value: "<div class=\"col-12 col-xl-5\" style=\"justify-content\">\r\n\t\t<h2>EXPLORA NUESTRAS UNIVERSIDADES</h2>\r\n\r\n\t\t<p>Encuentra un nuevo lugar donde continuar tus estudios, conocer gente nueva y aprender un nuevo idioma. Antes de ello, deberías:</p>\r\n\r\n\t\t<ul>\r\n\t\t\t<li>\r\n\t\t\t\tAveriguar qué\r\n\t\t\t\t<strong>universidades</strong>\r\n\t\t\t\testán\r\n\t\t\t\t<strong>disponibles</strong>\r\n\t\t\t\tdesde tu universidad de origen en tu oficina internacional local.\r\n\t\t\t</li>\r\n\t\t\t<li>\r\n\t\t\t\tAsegurarte de que los\r\n\t\t\t\t<strong>cursos</strong>\r\n\t\t\t\tse ajustan a tu titulación, se imparten en un idioma que comprendas y encajan en tu\r\n\t\t\t\t<strong>calendario</strong>\r\n\t\t\t\tacadémico.\r\n\t\t\t</li>\r\n\t\t\t<li>\r\n\t\t\t\tEvaluar el\r\n\t\t\t\t<strong>alojamiento</strong>,\r\n\t\t\t\tel\r\n\t\t\t\t<strong>transporte</strong>\r\n\t\t\t\ty los\r\n\t\t\t\t<strong>gastos</strong>\r\n\t\t\t\tdiarios.\r\n\t\t\t</li>\r\n\t\t\t<li>\r\n\t\t\t\tInvestigar la cultura local, la\r\n\t\t\t\t<strong>vida estudiantil</strong>\r\n\t\t\t\ty las oportunidades de crecimiento personal y\r\n\t\t\t\t<strong>profesional</strong>.\r\n\t\t\t</li>\r\n\t\t\t<li>\r\n\t\t\t\tComprobar la cobertura sanitaria, la\r\n\t\t\t\t<strong>seguridad</strong>\r\n\t\t\t\ty la disponibilidad de alojamiento.\r\n\t\t\t</li>\r\n\t\t</ul>\r\n\r\n\t\t<p style=\"text-align: center; font-size: 18px; font-weight: bold; color: #000;\">¡No pierdas la oportunidad!</p>\r\n</div>"
